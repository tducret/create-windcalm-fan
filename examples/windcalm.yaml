# Import through Create device > Advanced set up options > Import from file.
# The component and packages are downloaded from GitHub automatically.
substitutions:
  windcalm_repository: tducret/create-windcalm-fan
  windcalm_version: v0.1.0
  windcalm_component_source: github://${windcalm_repository}@${windcalm_version}

esphome:
  name: windcalm-controller
  friendly_name: Windcalm Controller

logger: {level: DEBUG}

packages:
  windcalm:
    url: https://github.com/${windcalm_repository}
    ref: ${windcalm_version}
    files:
      - packages/controller-esp32-s3.yaml
      - path: packages/fan.yaml
        vars:
          fan_id: bedroom_fan
          fan_name: Bedroom Fan
          remote_id: "0x12345"  # Sample only: replace with your paired remote's ID.
      # Optional second fan: remove this entire entry if you only have one fan.
      - path: packages/fan.yaml
        vars:
          fan_id: living_room_fan
          fan_name: Living Room Fan
          remote_id: "0x6789A"  # Sample only: replace with your paired remote's ID.
      # Add more entries with unique fan_id and remote_id values as needed.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret windcalm_api_key

ota:
  - platform: esphome
